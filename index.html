<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAO STUDIO - Pro AI Photo Studio & Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    .glass-card {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-pink-500 selection:text-white">

  <!-- Header -->
  <header class="sticky top-0 z-50 glass-card border-b border-slate-800/80 px-4 py-3.5">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <h1 class="text-xl font-black tracking-wider bg-gradient-to-r from-white via-slate-200 to-pink-500 bg-clip-text text-transparent">
          RAO <span class="text-pink-500">STUDIO</span>
        </h1>
      </div>
      <button onclick="document.getElementById('imageInput').click()" class="text-xs font-semibold bg-gradient-to-r from-purple-600 to-pink-600 text-white px-4 py-2 rounded-xl shadow-lg">
        <i class="fa-solid fa-plus mr-1"></i> New Photo
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="max-w-4xl mx-auto p-4 w-full space-y-6 pb-20">
    
    <!-- Preview Box with Dynamic Background & Text Overlay -->
    <div class="glass-card rounded-3xl p-4 md:p-6 shadow-2xl space-y-6">
      
      <div id="bgCanvasWrapper" class="bg-slate-900 rounded-2xl border border-slate-800 p-6 flex flex-col items-center justify-center min-h-[380px] relative overflow-hidden transition-all duration-300">
        
        <div id="uploadPlaceholder" class="text-center space-y-3 py-10 cursor-pointer" onclick="document.getElementById('imageInput').click()">
          <div class="w-16 h-16 rounded-2xl bg-slate-800/80 flex items-center justify-center mx-auto text-pink-500 text-2xl shadow-inner">
            <i class="fa-solid fa-cloud-arrow-up"></i>
          </div>
          <p class="text-sm text-slate-300 font-medium">Tap to upload your photo</p>
          <p class="text-xs text-slate-500">Photoroom background, AI Assistant & HD editing</p>
        </div>

        <div class="relative flex items-center justify-center">
          <img id="imagePreview" class="hidden max-h-[420px] w-auto object-contain rounded-xl shadow-2xl transition-all duration-75">
          <div id="textOverlay" class="absolute bottom-4 font-black text-white text-lg tracking-wider drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] pointer-events-none hidden"></div>
        </div>

        <canvas id="photoCanvas" class="hidden"></canvas>
        <input
