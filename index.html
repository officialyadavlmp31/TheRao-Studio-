<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Studio Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

  <header class="bg-slate-800/90 border-b border-slate-700 px-4 py-3 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center text-white shadow-lg">
          <i class="fa-solid fa-wand-magic-sparkles text-xl"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Photo Studio Pro</h1>
          <p class="text-[10px] text-slate-400">Free HD Photo Editor</p>
        </div>
      </div>
      <button onclick="resetFilters()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1.5 rounded-lg transition">
        <i class="fa-solid fa-rotate-left mr-1"></i> Reset
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 w-full flex-1 flex flex-col md:flex-row gap-6">
    <div class="flex-1 bg-slate-950 rounded-2xl border border-slate-800 p-4 flex flex-col items-center justify-center min-h-[300px] relative overflow-hidden shadow-inner">
      <div id="uploadPlaceholder" class="text-center space-y-3">
        <div class="w-16 h-16 rounded-full bg-slate-800/80 flex items-center justify-center mx-auto text-indigo-400 text-2xl">
          <i class="fa-solid fa-image"></i>
        </div>
        <p class="text-sm text-slate-400">Apni photo chuno aur edit karna shuru karo</p>
        <button onclick="document.getElementById('imageInput').click()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-xl text-xs transition shadow-lg shadow-indigo-600/30">Upload Photo</button>
      </div>
      <img id="imagePreview" class="hidden max-h-[450px] w-auto object-contain rounded-lg transition-all duration-75">
      <input type="file" id="imageInput" accept="image/*" class="hidden">
    </div>

    <div class="w-full md:w-80 bg-slate-800/80 rounded-2xl border border-slate-700 p-4 space-y-5">
      <h2 class="text-sm font-bold text-slate-300 border-b border-slate-700/60 pb-2">
        <span><i class="fa-solid fa-sliders mr-2 text-indigo-400"></i> Adjustments</span>
      </h2>

      <div class="space-y-1">
        <div class="flex justify-between text-xs text-slate-400"><span>Brightness</span><span id="valBrightness">100%</span></div>
        <input type="range" id="brightness" min="0" max="200" value="100" class="w-full accent-indigo-500 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
      </div>

      <div class="space-y-1">
        <div class="flex justify-between text-xs text-slate-400"><span>Contrast</span><span id="valContrast">100%</span></div>
        <input type="range" id="contrast" min="0" max="200" value="100" class="w-full accent-indigo-500 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
      </div>

      <div class="space-y-1">
        <div class="flex justify-between text-xs text-slate-400"><span>Saturation</span><span id="valSaturate">100%</span></div>
        <input type="range" id="saturate" min="0" max="200" value="100" class="w-full accent-indigo-500 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
      </div>

      <div class="space-y-1">
        <div class="flex justify-between text-xs text-slate-400"><span>Blur</span><span id="valBlur">0px</span></div>
        <input type="range" id="blur" min="0" max="20" value="0" class="w-full accent-indigo-500 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
      </div>

      <div class="pt-3 border-t border-slate-700/60">
        <button id="downloadBtn" onclick="downloadImage()" disabled class="w-full bg-slate-700 text-slate-500 font-medium py-3 rounded-xl text-xs flex items-center justify-center gap-2 cursor-not-allowed">
          <i class="fa-solid fa-download"></i> Download HD Image
        </button>
      </div>
    </div>
  </main>

  <script>
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');
    const uploadPlaceholder = document.getElementById('uploadPlaceholder');
    const downloadBtn = document.getElementById('downloadBtn');

    const brightness = document.getElementById('brightness');
    const contrast = document.getElementById('contrast');
    const saturate = document.getElementById('saturate');
    const blur = document.getElementById('blur');

    let originalImage = null;

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          imagePreview.src = event.target.result;
          originalImage = new Image();
          originalImage.src = event.target.result;
          imagePreview.classList.remove('hidden');
          uploadPlaceholder.classList.add('hidden');
          downloadBtn.disabled = false;
          downloadBtn.className = "w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl text-xs transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 cursor-pointer";
        };
        reader.readAsDataURL(file);
      }
    });

    function applyFilters() {
      const b = brightness.value;
      const c = contrast.value;
      const s = saturate.value;
      const bl = blur.value;

      document.getElementById('valBrightness').innerText = b + '%';
      document.getElementById('valContrast').innerText = c + '%';
      document.getElementById('valSaturate').innerText = s + '%';
      document.getElementById('valBlur').innerText = bl + 'px';

      imagePreview.style.filter = `brightness(${b}%) contrast(${c}%) saturate(${s}%) blur(${bl}px)`;
    }

    [brightness, contrast, saturate, blur].forEach(slider => slider.addEventListener('input', applyFilters));

    function resetFilters() {
      brightness.value = 100; contrast.value = 100; saturate.value = 100; blur.value = 0;
      applyFilters();
    }

    function downloadImage() {
      if (!originalImage) return;
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = originalImage.width;
      canvas.height = originalImage.height;
      const bl = blur.value * (originalImage.width / 800);
      ctx.filter = `brightness(${brightness.value}%) contrast(${contrast.value}%) saturate(${saturate.value}%) blur(${bl}px)`;
      ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
      const link = document.createElement('a');
      link.download = 'edited-photo.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
